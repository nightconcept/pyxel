name: release

on:
  push:
    tags:
      - "ne-v*" # [pyxel-ne] Fork releases only: GitHub release, no PyPI.

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: macos-15
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten wheels
        run: |
          find dist -type f -name "*.whl" -exec mv {} dist/ \;
          find dist -type d -empty -delete

      - name: Get Pyxel version
        run: |
          PYXEL_VERSION=$(echo $GITHUB_REF | sed 's/refs\/tags\/ne-v//')
          echo "PYXEL_VERSION=${PYXEL_VERSION}" >> $GITHUB_ENV

      - name: Detect pre-release
        run: |
          if echo "$PYXEL_VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: pyxel-ne ${{ env.PYXEL_VERSION }}
          tag_name: ${{ github.ref }}
          files: dist/*
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
